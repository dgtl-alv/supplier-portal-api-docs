name: Secret Scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out the exact proposed commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, reviewed commit
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false

      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          install_dir=$(mktemp -d "$RUNNER_TEMP/gitleaks-bin.XXXXXX")
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$install_dir/gitleaks.tar.gz"
          printf '%s  %s\n' 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb "$install_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$install_dir/gitleaks.tar.gz" -C "$install_dir" gitleaks
          chmod 0755 "$install_dir/gitleaks"
          printf 'SECRET_SCANNER=%s/gitleaks\n' "$install_dir" >> "$GITHUB_ENV"

      - name: Reject detected credentials in files and incoming commits
        shell: bash
        run: |
          python3 - <<'PYTHON'
          """Fail closed on detected committed secrets without executing project code."""
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import subprocess
          import sys
          import tempfile
          
          
          def main():
              root = Path(os.environ['GITHUB_WORKSPACE']).resolve()
              scanner = Path(os.environ['SECRET_SCANNER']).resolve()
          
              def git(*args):
                  result = subprocess.run(['git', '-c', 'core.hooksPath=/dev/null', *args], cwd=root,
                                          stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=300)
                  if result.returncode:
                      raise RuntimeError('Git inspection failed')
                  return result.stdout
          
              head = git('rev-parse', 'HEAD').decode().strip()
              event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
              event_name = os.environ['GITHUB_EVENT_NAME']
              if event_name == 'pull_request':
                  base = event['pull_request']['base']['sha']
                  expected = event['pull_request']['head']['sha']
              elif event_name == 'push':
                  base, expected = event.get('before', ''), event['after']
              elif event_name == 'workflow_dispatch':
                  base, expected = '', os.environ['GITHUB_SHA']
              else:
                  raise RuntimeError('Unsupported event')
              if not re.fullmatch('[0-9a-f]{40}', expected) or expected != head:
                  raise RuntimeError('Checkout does not match event commit')
              if base and base != '0' * 40:
                  if not re.fullmatch('[0-9a-f]{40}', base):
                      raise RuntimeError('Invalid comparison commit')
                  git('cat-file', '-e', base + '^{commit}')
                  log_range = base + '..' + head
              else:
                  # New branches/manual checks include reachable history, never silently skip it.
                  log_range = head
          
              with tempfile.TemporaryDirectory(prefix='secret-scan-', dir=os.environ.get('RUNNER_TEMP')) as tmp:
                  scratch = Path(tmp)
                  config = scratch / 'policy.toml'
                  config.write_text('title = "Required secret scan"\n[extend]\nuseDefault = true\n')
                  ignore = scratch / 'empty-ignore'
                  ignore.write_text('')
                  snapshot = scratch / 'snapshot'
                  snapshot.mkdir()
                  entries = git('ls-tree', '-r', '-z', head).split(b'\0')
                  count = 0
                  submodules = 0
                  # Read committed blobs directly: no filters, hooks, symlink following or export-ignore.
                  with subprocess.Popen(['git', 'cat-file', '--batch'], cwd=root, stdin=subprocess.PIPE,
                                        stdout=subprocess.PIPE, stderr=subprocess.DEVNULL) as cat:
                      for entry in filter(None, entries):
                          metadata, raw_path = entry.split(b'\t', 1)
                          mode, kind, oid = metadata.split()
                          if kind == b'commit':
                              submodules += 1
                              continue
                          if kind != b'blob':
                              raise RuntimeError('Unexpected Git tree entry')
                          name = os.fsdecode(raw_path)
                          parts = PurePosixPath(name)
                          if parts.is_absolute() or '..' in parts.parts or '.git' in parts.parts:
                              raise RuntimeError('Unsafe tree path')
                          target = snapshot / name
                          target.parent.mkdir(parents=True, exist_ok=True)
                          cat.stdin.write(oid + b'\n')
                          cat.stdin.flush()
                          header = cat.stdout.readline().split()
                          if len(header) != 3 or header[1] != b'blob':
                              raise RuntimeError('Cannot read committed blob')
                          remaining = int(header[2])
                          with target.open('wb') as output:
                              while remaining:
                                  chunk = cat.stdout.read(min(remaining, 1024 * 1024))
                                  if not chunk:
                                      raise RuntimeError('Incomplete committed blob')
                                  output.write(chunk)
                                  remaining -= len(chunk)
                          if cat.stdout.read(1) != b'\n':
                              raise RuntimeError('Invalid blob delimiter')
                          count += 1
                      cat.stdin.close()
                      if cat.wait(timeout=60):
                          raise RuntimeError('Git blob reader failed')
                  print(f'Scanning {count} committed files and incoming commit history.')
                  if submodules:
                      print(f'::warning::{submodules} submodule reference(s): submodule contents require scanning in their owning repositories.')
                  common = ['--config', str(config), '--gitleaks-ignore-path', str(ignore),
                            '--ignore-gitleaks-allow', '--redact=100', '--no-banner', '--no-color',
                            '--log-level=error', '--report-format=json', '--exit-code=10',
                            '--max-decode-depth=5', '--max-archive-depth=2', '--timeout=900']
                  total = 0
                  for label, args in [('current-tree', ['dir', str(snapshot)]),
                                      ('incoming-history', ['git', str(root), '--log-opts=' + log_range])]:
                      report = scratch / (label + '.json')
                      result = subprocess.run([str(scanner), *args, *common, '--report-path', str(report)],
                                              cwd=scratch, stdout=subprocess.PIPE, stderr=subprocess.PIPE, timeout=960)
                      if result.returncode not in (0, 10) or not report.is_file():
                          # Never echo scanner stderr: malformed inputs may include credentials.
                          raise RuntimeError('Secret scanner did not complete')
                      findings = json.loads(report.read_text())
                      if not isinstance(findings, list) or bool(findings) != (result.returncode == 10):
                          raise RuntimeError('Secret scanner report/exit status mismatch')
                      total += len(findings)
                      print(f'{label}: {len(findings)} detected credential finding(s).')
                      for item in findings[:100]:
                          # Whitelist only locations/rule identifiers, never Match, Secret or commit messages.
                          path = str(item.get('File', '')).removeprefix(str(snapshot) + '/')
                          print(json.dumps({'file': path, 'line': item.get('StartLine'), 'rule': item.get('RuleID')}, ensure_ascii=True))
                  if total:
                      print('::error::Detected committed credentials. Remove them, rotate real credentials, and rewrite unpublished commits containing them before retrying. Values are not printed.')
                  else:
                      print('Secret scan passed: no credentials detected by the pinned policy.')
                  return 1 if total else 0
          
          
          if __name__ == '__main__':
              try:
                  sys.exit(main())
              except Exception:
                  print('::error::Secret scan could not complete. Failing closed; no source or credential values are printed.')
                  sys.exit(2)
          PYTHON
